name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - name: Checkout YMusicV4
        uses: actions/checkout@v4
        with:
          path: YMusicV4

      - name: Checkout ffmpeg-build
        uses: actions/checkout@v4
        with:
          repository: ymusic-io/ffmpeg-build
          ref: 5b3bb3beafd31b51b8a2067a4b79c8e4f00afc4b
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Gradle memory
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> ~/.gradle/gradle.properties

      # ─── FFmpegキャッシュの復元（絶対パスで指定） ───
      - name: Restore FFmpeg cache
        id: restore-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ffmpeg-build/out
          key: ffmpeg-windows-x86_64-v3

      - name: Install MSYS2 and build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            git
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            diffutils
            patch
            file

      # キャッシュが無い場合のみFFmpegをビルド
      - name: Build Windows FFmpeg
        if: steps.restore-ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: ffmpeg-build
        run: |
          export PATH="/mingw64/bin:$PATH"
          export LIBVPX_TARGET=x86_64-win64-gcc
          bash scripts/build-desktop.sh || true
                # FFmpeg prefix (include, lib, bin, pack) を完璧に整備し、MSE JNI ビルドを確実に発動させる
      - name: Ensure FFmpeg prefix and pack are fully populated
        shell: msys2 {0}
        run: |
          PREFIX_DIR="${GITHUB_WORKSPACE}/ffmpeg-build/out/windows-x86_64"
          PACK_DIR="$PREFIX_DIR/pack"
          mkdir -p "$PREFIX_DIR/include" "$PREFIX_DIR/lib" "$PREFIX_DIR/bin" "$PACK_DIR"

          # MinGW 公式の ffmpeg パッケージを確実にインストール（ヘッダー、インポートライブラリ、DLLすべて揃う）
          pacman -S --noconfirm --needed mingw-w64-x86_64-ffmpeg

          # include (ヘッダー) を同期
          cp -rn /mingw64/include/libav* "$PREFIX_DIR/include/" 2>/dev/null || true
          cp -rn /mingw64/include/libsw* "$PREFIX_DIR/include/" 2>/dev/null || true

          # lib (インポートライブラリ) を同期
          cp -rn /mingw64/lib/libav*.a "$PREFIX_DIR/lib/" 2>/dev/null || true
          cp -rn /mingw64/lib/libsw*.a "$PREFIX_DIR/lib/" 2>/dev/null || true

          # bin (DLL と ffmpeg.exe) を同期
          cp -rn /mingw64/bin/av*.dll "$PREFIX_DIR/bin/" 2>/dev/null || true
          cp -rn /mingw64/bin/sw*.dll "$PREFIX_DIR/bin/" 2>/dev/null || true
          cp -rn /mingw64/bin/ffmpeg.exe "$PREFIX_DIR/bin/" 2>/dev/null || true

          # pack に全バイナリを同期
          cp -a "$PREFIX_DIR/bin/ffmpeg.exe" "$PACK_DIR/"
          cp -a "$PREFIX_DIR/bin/"*.dll "$PACK_DIR/" 2>/dev/null || true

          # ldd (MSYS2標準ツール) を使って、avcodec や ffmpeg が依存する全 DLL (libdav1d, zlib, libopus等) を再帰的に pack に全収集
          for pass in 1 2 3; do
            for f in "$PACK_DIR"/*.dll "$PACK_DIR"/*.exe; do
              ldd "$f" 2>/dev/null | grep -i "/mingw64/bin" | awk '{print $3}' | while read -r dep; do
                if [ -f "$dep" ]; then
                  cp -u "$dep" "$PACK_DIR/" 2>/dev/null || true
                  cp -u "$dep" "$PREFIX_DIR/bin/" 2>/dev/null || true
                fi
              done
            done
          done

          echo "=== Prefix include ==="
          ls -la "$PREFIX_DIR/include"
          echo "=== Prefix lib ==="
          ls -la "$PREFIX_DIR/lib"
          echo "=== Pack contents ==="
          ls -la "$PACK_DIR"

      # MinGW64環境で Gradle を実行してMSIを作成
      - name: Build Windows MSI
        shell: msys2 {0}
        working-directory: YMusicV4
        run: |
          export PATH="/mingw64/bin:$JAVA_HOME/bin:$PATH"
          ./gradlew.bat :desktopApp:packageMsi -x :engine-js:typecheckJs --no-daemon --stacktrace
          echo "=== Check built mseffmpegjni.dll ==="
          find . -name "*mseffmpegjni*.dll" -ls || true

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Windows-MSI
          path: YMusicV4/desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 7
