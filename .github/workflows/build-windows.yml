name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - name: Checkout YMusicV4
        uses: actions/checkout@v4
        with:
          path: YMusicV4

      - name: Checkout ffmpeg-build
        uses: actions/checkout@v4
        with:
          repository: ymusic-io/ffmpeg-build
          ref: 5b3bb3beafd31b51b8a2067a4b79c8e4f00afc4b
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Gradle memory
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> ~/.gradle/gradle.properties

      # ─── FFmpegキャッシュの復元 ───
      - name: Restore FFmpeg cache
        id: restore-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out
          key: ffmpeg-windows-x86_64-v2

      - name: Install MSYS2 and build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            git
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            diffutils
            patch
            file

      # キャッシュが無い場合のみFFmpegをビルド
      - name: Build Windows FFmpeg
        if: steps.restore-ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: ffmpeg-build
        run: |
          export PATH="/mingw64/bin:$PATH"
          export LIBVPX_TARGET=x86_64-win64-gcc
          bash scripts/build-desktop.sh || true
          ls -la out/windows-x86_64/pack/ || true

      # ビルド成功直後に即座にキャッシュを確定保存（途中で失敗しても次回以降再利用される）
      - name: Save FFmpeg cache immediately
        if: steps.restore-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ffmpeg-build/out
          key: ffmpeg-windows-x86_64-v2

      # MinGW64のツール（gcc, ninja, cmake）をPATHに通してGradleを実行
      - name: Build Windows MSI
        shell: msys2 {0}
        working-directory: YMusicV4
        run: |
          export PATH="/mingw64/bin:$JAVA_HOME/bin:$PATH"
          ./gradlew.bat :desktopApp:packageMsi -x :engine-js:typecheckJs --no-daemon --stacktrace

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Windows-MSI
          path: YMusicV4/desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 7
