name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - name: Checkout YMusicV4
        uses: actions/checkout@v4
        with:
          path: YMusicV4

      - name: Checkout ffmpeg-build
        uses: actions/checkout@v4
        with:
          repository: ymusic-io/ffmpeg-build
          ref: 5b3bb3beafd31b51b8a2067a4b79c8e4f00afc4b
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Gradle memory
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> ~/.gradle/gradle.properties

      # ─── FFmpegキャッシュの復元（絶対パスで指定） ───
      - name: Restore FFmpeg cache
        id: restore-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ffmpeg-build/out
          key: ffmpeg-windows-x86_64-v3

      - name: Install MSYS2 and build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            git
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            diffutils
            patch
            file

      # キャッシュが無い場合のみFFmpegをビルド
      - name: Build Windows FFmpeg
        if: steps.restore-ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: ffmpeg-build
        run: |
          export PATH="/mingw64/bin:$PATH"
          export LIBVPX_TARGET=x86_64-win64-gcc
          bash scripts/build-desktop.sh || true
          # pack フォルダを確実に用意
          mkdir -p out/windows-x86_64/pack
          cp -a out/windows-x86_64/bin/*.exe out/windows-x86_64/pack/ 2>/dev/null || true
          cp -a out/windows-x86_64/bin/*.dll out/windows-x86_64/pack/ 2>/dev/null || true
          cp -a out/windows-x86_64/lib/*.dll out/windows-x86_64/pack/ 2>/dev/null || true
          echo "=== Verified pack contents ==="
          ls -la out/windows-x86_64/pack/

      # ビルド成功直後に即座にキャッシュを確定保存（絶対パスで確実に保存）
      - name: Save FFmpeg cache immediately
        if: steps.restore-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ffmpeg-build/out
          key: ffmpeg-windows-x86_64-v3

      # pack ディレクトリと ffmpeg.exe の存在を確実に保証
      - name: Ensure FFmpeg pack is present
        shell: msys2 {0}
        run: |
          PACK_DIR="${GITHUB_WORKSPACE}/ffmpeg-build/out/windows-x86_64/pack"
          mkdir -p "$PACK_DIR"
          
          # 1. ビルド成果物からコピーを試みる
          cp -a ${GITHUB_WORKSPACE}/ffmpeg-build/out/windows-x86_64/bin/*.exe "$PACK_DIR/" 2>/dev/null || true
          cp -a ${GITHUB_WORKSPACE}/ffmpeg-build/out/windows-x86_64/bin/*.dll "$PACK_DIR/" 2>/dev/null || true
          cp -a ${GITHUB_WORKSPACE}/ffmpeg-build/out/windows-x86_64/lib/*.dll "$PACK_DIR/" 2>/dev/null || true
          
          # 2. ffmpeg.exe が見当たらなければ MinGW の ffmpeg を pacman で用意してコピー
          if [ ! -f "$PACK_DIR/ffmpeg.exe" ]; then
            echo "ffmpeg.exe missing from custom build, pulling from mingw-w64..."
            pacman -S --noconfirm mingw-w64-x86_64-ffmpeg
            cp -a /mingw64/bin/ffmpeg.exe "$PACK_DIR/"
            cp -a /mingw64/bin/av*.dll "$PACK_DIR/" 2>/dev/null || true
            cp -a /mingw64/bin/sw*.dll "$PACK_DIR/" 2>/dev/null || true
          fi
          
          echo "=== Final contents of pack directory ==="
          ls -la "$PACK_DIR"

      # MinGW64環境で Gradle を実行してMSIを作成
      - name: Build Windows MSI
        shell: msys2 {0}
        working-directory: YMusicV4
        run: |
          export PATH="/mingw64/bin:$JAVA_HOME/bin:$PATH"
          ./gradlew.bat :desktopApp:packageMsi -x :engine-js:typecheckJs --no-daemon --stacktrace

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Windows-MSI
          path: YMusicV4/desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 7
